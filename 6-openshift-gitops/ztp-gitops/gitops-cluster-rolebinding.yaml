apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ztp-gitops-service-account
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gitops-service-account
  ## Defined in ./gitops-cluster-rolebinding.yaml
subjects:
- kind: ServiceAccount
  name: ztp-gitops-argocd-application-controller
  namespace: ztp-gitops
- kind: ServiceAccount
  name: ztp-cluster-argocd-application-controller
  namespace: ztp-gitops
- kind: ServiceAccount
  name: argocd-cluster-argocd-server
  namespace: ztp-gitops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitops-policy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: open-cluster-management:cluster-manager-admin
subjects:
- kind: ServiceAccount
  name: ztp-gitops-argocd-application-controller
  namespace: ztp-gitops