---
apiVersion: operator.open-cluster-management.io/v1
kind: MultiClusterHub
metadata:
  name: multiclusterhub
  namespace: open-cluster-management
  annotations:
    argocd.argoproj.io/sync-wave: "4"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    installer.open-cluster-management.io/mce-subscription-spec: '{"installPlanApproval": "Automatic"}'
spec:
  # -- Lab: single replica per controller to halve pod count & CPU.
  # -- Production: remove or set to High.
  availabilityConfig: Basic
  disableUpdateClusterImageSets: true
  overrides:
    components:
      - enabled: true
        name: console
      - enabled: true
        name: grc
      - enabled: true
        name: cluster-lifecycle
      - enabled: true
        name: multicluster-engine
      - enabled: true
        name: search
      - enabled: true
        name: app-lifecycle
      - enabled: true
        name: cluster-permission
      # -- Heavy / unused in lab — disable to reclaim CPU and memory
      - enabled: false
        name: insights
      - enabled: false
        name: volsync
      - enabled: false
        name: cluster-backup
      - enabled: false
        name: multicluster-observability
      - enabled: false
        name: submariner-addon
  separateCertificateManagement: false
