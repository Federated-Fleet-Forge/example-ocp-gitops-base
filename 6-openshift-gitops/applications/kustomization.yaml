apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - app-ztp-gitops-root.yaml


configMapGenerator:
- name: config
  envs:
  - gitops.properties

replacements:
- source:
   kind: ConfigMap
   name: config
   fieldPath: data.app_ztp_gitops_root_url
  targets:
  - select:
      kind: Application
      name: ztp-gitops-root
    fieldPaths:
    - spec.source.repoURL
- source:
    kind: ConfigMap
    name: config
    fieldPath: data.[target.revision]
  targets:
  - select:
      kind: Application
      name: ztp-gitops-root
    fieldPaths:
    - spec.source.targetRevision
