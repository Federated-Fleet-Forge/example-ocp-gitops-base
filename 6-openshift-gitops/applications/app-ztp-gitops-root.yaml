apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztp-gitops-root
  namespace: openshift-gitops
spec:
  destination:
    namespace: openshift-gitops
    server: https://kubernetes.default.svc
  project: default
  source:
    path: 6-openshift-gitops/ztp-gitops
    repoURL: https://repourl/XXX-gitops-base # value will be automatically updated based on gitops.properties
    targetRevision: main
  syncPolicy:
    syncOptions:
    - ApplyOutOfSyncOnly=true
    automated:
      prune: false
      selfHeal: false
