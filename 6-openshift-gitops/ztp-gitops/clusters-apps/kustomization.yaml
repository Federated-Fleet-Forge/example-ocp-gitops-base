apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - appset-clusters.yaml
  - appproject-ztp.yaml


configMapGenerator:
- name: configmap-clusters
  envs:
  - gitops.properties

replacements:
- source:
    kind: ConfigMap
    name: configmap-clusters
    fieldPath: data.ztp_appproject_url
  targets:
  - select:
      kind: AppProject
      name: ztp-appproject
    fieldPaths:
    - spec.sourceRepos.0
- source:
   kind: ConfigMap
   name: configmap-clusters
   fieldPath: data.clusters_appset_url
  targets:
  - select:
      kind: ApplicationSet
      name: clusters-appset
    fieldPaths:
    - spec.generators.0.git.repoURL
    - spec.template.spec.source.repoURL
- source:
    kind: ConfigMap
    name: configmap-clusters
    fieldPath: data.[target.revision]
  targets:
  - select:
      kind: ApplicationSet
      name: clusters-appset
    fieldPaths:
    - spec.generators.0.git.revision
    - spec.template.spec.source.targetRevision